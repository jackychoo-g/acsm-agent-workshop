<rect x="704" y="170" width="130" height="150" rx="6" fill="#ffffff"/><rect x="704" y="170" width="130" height="150" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,4"/>
